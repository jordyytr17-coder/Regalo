<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flores Amarillas para Kerly 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050308;
    --gold:#ffd84d;
    --gold-soft:#f4c95d;
    --gold-dim:#c99a2e;
    --cream:#fff4d6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    overflow:hidden;
    font-family:'Cormorant Garamond', Georgia, serif;
  }
  #scene{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #flash{ position:fixed; inset:0; z-index:60; background:#fff8e6; opacity:0; pointer-events:none; mix-blend-mode:screen; }

  /* ---------- Tap to start ---------- */
  #tap-overlay{
    position:fixed; inset:0; z-index:500;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 45%, #16140a 0%, #050409 70%, #020103 100%);
    color:var(--cream); text-align:center; cursor:pointer;
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  #tap-overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  #tap-overlay h1{
    font-family:'Great Vibes','Brush Script MT', cursive;
    font-size:clamp(2.2rem,9.5vw,3.6rem); color:var(--gold); margin:0 0 .3rem;
    text-shadow:0 0 22px rgba(255,216,77,.55);
  }
  #tap-overlay p{ margin:0; font-size:clamp(.85rem,3.2vw,1rem); opacity:.75; letter-spacing:.5px; }
  .pulse-dot{
    margin-top:1.6rem; width:14px; height:14px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 18px 4px rgba(255,216,77,.7);
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.5); opacity:.5; } }

  /* ---------- Sound toggle ---------- */
  #sound-toggle{
    position:fixed; top:max(14px, env(safe-area-inset-top)); right:14px; z-index:150;
    width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,216,77,.35);
    color:var(--gold); font-size:1.05rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0; transition:opacity .8s ease; backdrop-filter:blur(4px);
  }
  #sound-toggle.show{ opacity:1; }

  /* ---------- Titles ---------- */
  .title-main{
    position:fixed; top:3%; left:50%; transform:translateX(-50%);
    width:min(90%, calc(100% - 140px));
    text-align:center; z-index:20; pointer-events:none;
    font-family:'Great Vibes','Brush Script MT', cursive;
    font-size:clamp(1.3rem,6.2vw,2.2rem); color:var(--cream);
    line-height:1.15;
    text-shadow:0 0 14px rgba(255,216,77,.8), 0 0 34px rgba(255,216,77,.35);
    opacity:0; transition:opacity 1.6s ease;
  }
  .title-main.show{ opacity:1; animation:titleSway 7s ease-in-out infinite; }
  .title-sub{
    position:fixed; left:50%; transform:translate(-50%,0);
    top:29%;
    text-align:center; z-index:20; pointer-events:none;
    font-family:'Great Vibes','Brush Script MT', cursive;
    font-size:clamp(1.3rem,5.5vw,1.9rem); color:var(--gold);
    text-shadow:0 0 12px rgba(255,216,77,.85);
    opacity:0; transition:opacity 1.6s ease;
  }
  .title-sub.show{ opacity:1; animation:titleSway 7s ease-in-out infinite 0.4s; }
  @keyframes titleSway{
    0%,100%{ transform:translateX(-50%) rotate(-1.2deg); }
    50%{ transform:translateX(-50%) rotate(1.2deg); }
  }

  /* ---------- Orbit items (icons + phrases), JS-driven position ---------- */
  .orbit-item{ position:fixed; left:0; top:0; z-index:10; will-change:transform; pointer-events:none; }
  .orbit-inner{
    text-align:center; opacity:0; transform:translate(-50%,-50%) scale(.2);
    transition:opacity 1.1s cubic-bezier(.2,.8,.25,1), transform 1.1s cubic-bezier(.2,.8,.25,1);
  }
  .orbit-inner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .orbit-inner.icon .flower-img{
    display:block; width:clamp(32px,8.6vw,60px); height:auto;
    filter:drop-shadow(0 0 10px rgba(255,210,90,.85)) drop-shadow(0 0 16px rgba(255,180,40,.3));
    animation:sway 5s ease-in-out infinite;
  }
  @keyframes sway{ 0%,100%{ transform:rotate(-4deg) translateY(0); } 50%{ transform:rotate(4deg) translateY(-4px); } }

  .orbit-inner.phrase{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:600;
    color:var(--cream); white-space:nowrap;
    text-shadow:0 0 10px rgba(255,210,110,.8), 0 0 20px rgba(255,180,60,.35);
  }
  .orbit-inner.phrase.big{ font-size:clamp(.75rem,3vw,1rem); color:var(--gold); }
  .orbit-inner.phrase.mid{ font-size:clamp(.65rem,2.4vw,.85rem); }
  .orbit-inner.phrase.small{ font-size:clamp(.58rem,2vw,.72rem); opacity:.85; }

  /* ---------- Letter button ---------- */
  #open-letter-btn{
    position:fixed; left:50%; bottom:5%; transform:translate(-50%,18px);
    z-index:30; opacity:0; pointer-events:none;
    background:linear-gradient(135deg,#ffe08a,#f2b93b); color:#241a00; border:none;
    border-radius:999px; padding:.8rem 1.6rem; font-size:.92rem; font-weight:700;
    font-family:'Cormorant Garamond', serif;
    box-shadow:0 0 26px rgba(255,210,90,.55);
    cursor:pointer; transition:opacity .9s ease, transform .9s ease;
  }
  #open-letter-btn.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #open-letter-btn:active{ transform:translate(-50%,0) scale(.96); }

  /* ---------- Envelope + Letter modal ---------- */
  #letter-modal{
    position:fixed; inset:0; z-index:400;
    background:rgba(4,3,8,.82); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .5s ease; padding:20px;
  }
  #letter-modal.show{ opacity:1; pointer-events:auto; }
  .envelope-wrap{
    position:relative; width:min(88vw,340px); height:220px;
    perspective:1000px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .envelope-wrap.opened{ display:none; }
  .envelope{
    position:relative; width:100%; height:180px;
    background:linear-gradient(160deg,#3a2c0d,#1c1608);
    border:1px solid rgba(255,216,77,.35); border-radius:8px;
    box-shadow:0 0 40px rgba(255,200,80,.2);
  }
  .envelope .flap{
    position:absolute; top:0; left:0; width:100%; height:90px;
    background:linear-gradient(160deg,#4a3812,#241b09);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center; transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.4,.1,.2,1);
    border-bottom:1px solid rgba(255,216,77,.25);
  }
  .envelope-wrap.opening .flap{ transform:rotateX(-180deg); }
  .envelope .seal{
    position:absolute; top:64px; left:50%; transform:translate(-50%,-50%);
    font-size:1.6rem; z-index:5; filter:drop-shadow(0 0 8px rgba(255,210,90,.7));
    transition:opacity .3s ease, transform .3s ease;
  }
  .envelope-wrap.opening .seal{ opacity:0; transform:translate(-50%,-50%) scale(.3); }
  .envelope .tap-hint{
    position:absolute; bottom:14px; left:0; width:100%; text-align:center;
    font-size:.78rem; letter-spacing:1px; color:var(--gold-soft); opacity:.8; font-style:italic;
  }
  .letter-card{
    width:min(92vw,460px); max-height:82vh; overflow-y:auto;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,158,203,.28) 0%, rgba(255,158,203,0) 42%),
      radial-gradient(circle at 88% 14%, rgba(158,203,255,.24) 0%, rgba(158,203,255,0) 44%),
      radial-gradient(circle at 82% 90%, rgba(201,167,255,.24) 0%, rgba(201,167,255,0) 46%),
      radial-gradient(circle at 10% 85%, rgba(255,214,140,.28) 0%, rgba(255,214,140,0) 46%),
      linear-gradient(165deg,#fffaf0 0%,#fef1e0 50%,#fdeee8 100%);
    border:1px solid rgba(255,190,150,.6); border-radius:20px;
    padding:2.1rem 1.8rem 1.6rem; position:relative;
    transform:scale(.85) translateY(16px); opacity:0;
    transition:transform .6s cubic-bezier(.2,.8,.25,1), opacity .6s ease;
    box-shadow:0 0 50px rgba(255,180,120,.28), 0 0 80px rgba(255,158,203,.14), inset 0 0 40px rgba(255,220,180,.25);
    display:none;
  }
  .letter-card::before{
    content:''; position:absolute; top:0; left:14px; right:14px; height:4px;
    background:linear-gradient(90deg, #ffb3d1, #ffd88a, #a9d4ff, #cdb4ff, #ffc58a);
    border-radius:0 0 4px 4px; opacity:.95;
  }
  .letter-card.show{ display:block; transform:scale(1) translateY(0); opacity:1; }
  .letter-card .divider{ text-align:center; color:#c9986a; letter-spacing:6px; font-size:.85rem; margin-bottom:1rem; }
  .letter-card h2{
    font-family:'Great Vibes','Brush Script MT', cursive;
    background:linear-gradient(90deg,#e8a23a,#ff8fab,#8a7fd6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-size:clamp(1.9rem,7.5vw,2.5rem); margin:0 0 .2rem; text-align:center;
  }
  .letter-card p{ color:#5a4632; line-height:1.8; font-size:clamp(.92rem,3.3vw,1.03rem); white-space:pre-line; margin:0 0 .95rem; }
  .letter-card p.first::first-letter{
    font-family:'Great Vibes','Brush Script MT', cursive; font-size:2.6rem; color:#e8a23a;
    float:left; line-height:1; margin:0 .12em 0 0;
  }
  .letter-card .quote{
    font-style:italic; color:#8a7fd6; text-align:center; font-size:1.02em;
    padding:.6rem 1rem; margin:.3rem 0 1.1rem; border-top:1px solid rgba(138,127,214,.25);
    border-bottom:1px solid rgba(138,127,214,.25);
  }
  .letter-card .ps{ font-style:italic; opacity:.85; font-size:.92em; }
  .letter-flowers{
    display:flex; align-items:center; justify-content:center;
    margin:.6rem 0 .3rem;
  }
  .letter-flowers img{ filter:drop-shadow(0 0 12px rgba(255,190,80,.6)); }
  .letter-card .signature{
    text-align:right; font-family:'Great Vibes','Brush Script MT', cursive; color:#c9862e;
    font-size:clamp(1.2rem,4.5vw,1.5rem); margin-top:.6rem;
  }
  .close-btn{
    position:absolute; top:10px; right:14px; background:none; border:none;
    color:#b98a52; font-size:1.5rem; cursor:pointer; line-height:1; padding:6px;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="flash"></div>

<div class="title-main" id="title">Feliz Día de las Flores Amarillas</div>
<div class="title-sub" id="subtitle">para Kerly 🌻</div>

<div id="orbit-container"></div>

<button id="open-letter-btn">Abrir mi carta 💌</button>

<div id="letter-modal">
  <div class="envelope-wrap" id="envelope-wrap">
    <div class="envelope">
      <div class="flap"></div>
      <div class="seal">🌻</div>
      <div class="tap-hint">toca para abrir</div>
    </div>
  </div>
  <div class="letter-card" id="letter-card">
    <button class="close-btn" id="close-letter" aria-label="Cerrar">×</button>
    <div class="divider">🌻 · 🌷 · 🌼</div>
    <h2>Para Kerly</h2>
    <div id="letter-body"></div>
    <div class="letter-flowers" id="letter-flowers"></div>
    <div class="signature">Feliz día 🌻</div>
  </div>
</div>

<audio id="bg-music" loop preload="auto"></audio>
<button id="sound-toggle" aria-label="Silenciar música">🔊</button>

<div id="tap-overlay">
  <h1>Flores Amarillas para Ti</h1>
  <p>Toca la pantalla para comenzar</p>
  <div class="pulse-dot"></div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     🌻 PERSONALIZA TUS FLORES AQUÍ 🌻  (leer antes de tocar el resto)
     ------------------------------------------------------------
     PASO 1 — Las imágenes:
     Reemplaza los archivos dentro de la carpeta "flores/" (al lado
     de este .html) por tus propias imágenes PNG CON FONDO
     TRANSPARENTE para que se vean bien sobre el fondo oscuro.
     Recomendado: cuadradas, 400x400px o más, fondo transparente.
     Ya te dejé imágenes de ejemplo funcionando para que lo veas
     andar de inmediato — puedes reemplazarlas cuando quieras.

     PASO 2 — Si quieres AGREGAR una imagen nueva (no solo reemplazar):
       a) Añade una línea aquí abajo en FLOWER_IMAGES, por ejemplo:
            miFlor1: 'flores/mi_flor_1.png',
       b) Copia tu archivo "mi_flor_1.png" dentro de la carpeta flores/
       c) Baja hasta ICON_ITEMS (unas líneas más abajo) y agrega una
          fila nueva usando ese nombre, por ejemplo:
            { type:'miFlor1', ring:1, angleDeg:45 }
          - "ring" es 0, 1 o 2 (qué tan lejos del centro: 0=cerca, 2=lejos)
          - "angleDeg" es en qué punto del anillo empieza (0 a 360)
     ============================================================ */
  const FLOWER_IMAGES = {
    sunflower: 'flores/girasol.png',
    gerbera:   'flores/gerbera.png',
    tulip:     'flores/tulipan.png',
    daisy:     'flores/margarita.png',
    gift:      'flores/regalo.png',
    heart:     'flores/corazon.png',
    bouquet:   'flores/ramo.png'
    /* agrega aquí tus propias imágenes, ej: miFlor1: 'flores/mi_flor_1.png', */
  };
  /* Si una imagen no carga (por ejemplo, si borraste el archivo),
     se usa este círculo brillante de repuesto para que nada se rompa. */
  const FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
    '<circle cx="50" cy="50" r="30" fill="#ffd84d"/></svg>'
  );

  /* ============================================================
     🎵 TU PROPIA CANCIÓN (opcional) 🎵
     ------------------------------------------------------------
     Si ya descargaste una canción y quieres usarla en vez de la
     música que compuse:
     1) Crea una carpeta llamada "musica" al lado de este .html
        (al mismo nivel que la carpeta "flores"), si no existe ya.
     2) Copia tu archivo de audio ahí adentro. Formatos que
        funcionan: MP3, OGG, WAV, M4A.
     3) Escribe aquí abajo el nombre EXACTO de tu archivo
        (respetando mayúsculas/minúsculas y espacios):

          const MUSIC_FILE = 'musica/tu-cancion.mp3';

     Si el archivo no existe, no carga, o no lo agregas, la
     página automáticamente sigue usando la música generada como
     respaldo — nunca se queda en silencio.
     Nota: esto solo funciona en el archivo .html local (el que
     abres tú desde tu computador/celular). En el link publicado
     en línea, como no hay una carpeta "musica" ahí, siempre sonará
     la música generada.
     ============================================================ */
  const MUSIC_FILE = 'musica/tu-cancion.mp3';

  /* ---- ambient background sunflowers: slowly spinning, low opacity,
     placed in the empty dark corners so the scene feels fuller ---- */
  const bgFlowerImg = new Image();
  bgFlowerImg.src = FLOWER_IMAGES.sunflower;
  const BG_FLOWERS = [
    { xPct:0.10, yPct:0.13, size:0.16, speed:0.12,  opacity:0.16, dir:1  },
    { xPct:0.90, yPct:0.11, size:0.13, speed:-0.09, opacity:0.13, dir:-1 },
    { xPct:0.05, yPct:0.63, size:0.15, speed:0.10,  opacity:0.15, dir:-1 },
    { xPct:0.94, yPct:0.60, size:0.19, speed:0.08,  opacity:0.14, dir:1  },
    { xPct:0.16, yPct:0.90, size:0.13, speed:-0.11, opacity:0.13, dir:1  },
    { xPct:0.86, yPct:0.92, size:0.16, speed:0.09,  opacity:0.15, dir:-1 }
  ];

  /* ---- gentle butterflies wandering across the background ---- */
  const BUTTERFLY_COLORS = ['#ffd84d', '#ff9ecb', '#c9a7ff', '#fff0c2'];
  const BUTTERFLIES = [];
  (function buildButterflies(){
    for(let i=0;i<5;i++){
      BUTTERFLIES.push({
        baseX: 0.1 + Math.random()*0.8,
        baseY: 0.15 + Math.random()*0.7,
        ampX: 0.10 + Math.random()*0.10,
        ampY: 0.05 + Math.random()*0.06,
        freqX: 0.06 + Math.random()*0.05,
        freqY: 0.10 + Math.random()*0.08,
        phase: Math.random()*Math.PI*2,
        size: 8 + Math.random()*7,
        flapSpeed: 6 + Math.random()*4,
        color: BUTTERFLY_COLORS[i % BUTTERFLY_COLORS.length],
        opacity: 0.55 + Math.random()*0.3
      });
    }
  })();

  /* ---- Lista de flores/íconos que orbitan la galaxia ----
     Cada fila = una imagen orbitando. Copia una línea y cámbiale
     el "type" (debe existir arriba en FLOWER_IMAGES), el "ring"
     (0, 1 o 2) y el "angleDeg" (0 a 360) para agregar más. */
  const ICON_ITEMS = [
    { type:'sunflower', ring:0, angleDeg:20  },
    { type:'tulip',      ring:1, angleDeg:80  },
    { type:'gerbera',    ring:2, angleDeg:140 },
    { type:'gift',       ring:1, angleDeg:200 },
    { type:'bouquet',    ring:0, angleDeg:260 },
    { type:'sunflower',  ring:2, angleDeg:320 },
    { type:'tulip',      ring:0, angleDeg:110 },
    { type:'heart',      ring:1, angleDeg:340 },
    { type:'daisy',      ring:0, angleDeg:190 },
    { type:'tulip',      ring:2, angleDeg:230 },
    { type:'sunflower',  ring:1, angleDeg:5   },
    { type:'gerbera',    ring:0, angleDeg:300 },
    { type:'sunflower',  ring:2, angleDeg:60  },
    { type:'bouquet',    ring:1, angleDeg:160 }
  ];

  /* ---- Frases que orbitan la galaxia ----
     Edita, borra o agrega líneas en esta lista (cualquier cantidad).
     Se reparten solas entre los 3 anillos, no necesitas tocar nada más. */
  const PHRASES = [
    "Feliz día de las flores amarillas",
    "Espero que esto te saque una sonrisa",
    "Que tengas un lindo día",
    "Un detalle para alegrarte el día",
    "Que la alegría te acompañe",
    "Mereces cosas bonitas",
    "Sigue brillando",
    "Eres una persona increíble",
    "Un lindo detalle amarillo",
    "Que tu día esté lleno de color",
    "Nunca dejes de sonreír",
    "Sigue así de especial",
    "Que todo te salga bien",
    "Hoy es tu día",
    "Con buena onda",
    "Que sigas brillando siempre"
  ];

  /* ---- Texto de la carta ----
     Edita estos textos como quieras. "cls:'first'" hace que la
     primera letra salga grande y dorada; usa cls:'' en el resto.
     "cls:'quote'" muestra el texto como una frase destacada. */
  const LETTER_PARAGRAPHS = [
    { cls:'first', text:"Cada 21 de septiembre se celebra el día de las flores amarillas, y en cuanto lo supe pensé en armarte esta pequeña galaxia solo para ti." },
    { cls:'', text:"Porque eres de esas personas increíbles, únicas, de las que no se olvidan fácil." },
    { cls:'quote', text:"\"Las mejores sorpresas nacen de las ganas de ver a alguien sonreír.\"" },
    { cls:'', text:"Espero que cada estrella de esta galaxia te recuerde lo especial que eres." },
    { cls:'', text:"¡Feliz día de las flores amarillas, Kerly! 🌻" }
  ];
  const letterBody = document.getElementById('letter-body');
  LETTER_PARAGRAPHS.forEach(p=>{
    const el = document.createElement('p');
    if(p.cls) el.className = p.cls;
    el.textContent = p.text;
    letterBody.appendChild(el);
  });

  /* ---- Flor de la carta ----
     Usa la misma imagen configurada arriba en FLOWER_IMAGES.
     Cambia 'sunflower' por 'gerbera', 'tulip', etc. si quieres otra,
     o cambia el ancho ('width') para hacerla más grande o chica. */
  const letterFlowers = document.getElementById('letter-flowers');
  if(letterFlowers){
    const flowerImg = document.createElement('img');
    flowerImg.src = FLOWER_IMAGES.sunflower;
    flowerImg.alt = 'Flor amarilla';
    flowerImg.style.width = '86px';
    flowerImg.style.height = 'auto';
    flowerImg.onerror = function(){ this.onerror=null; this.src = FALLBACK_IMG; };
    letterFlowers.appendChild(flowerImg);
  }

  /* ============ CANVAS SETUP ============ */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W, H, DPR, minDim;
  let flowerCX, flowerCY, flowerLen;
  let orbitCX, orbitCY;
  let RINGS = [];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    minDim = Math.min(W,H);

    flowerCX = W * 0.5;
    flowerCY = H * 0.20;
    flowerLen = minDim * 0.17;

    orbitCX = W * 0.5;
    orbitCY = H * 0.58;

    RINGS = [
      { a: minDim*0.30, b: minDim*0.30*0.34 },
      { a: minDim*0.46, b: minDim*0.46*0.34 },
      { a: minDim*0.63, b: minDim*0.63*0.34 }
    ];
  }

  /* ============ STARFIELD (denser, fills the frame) ============ */
  const stars = [];
  (function buildStars(){
    for(let i=0;i<650;i++){
      stars.push({
        rx: Math.random(), ry: Math.random(),
        r: Math.random()*1.5 + 0.3,
        phase: Math.random()*Math.PI*2,
        speed: 0.5 + Math.random()*1.2,
        sparkle:false
      });
    }
    for(let i=0;i<30;i++){
      stars.push({
        rx: Math.random(), ry: Math.random()*0.85,
        r: Math.random()*1.1 + 1.6,
        phase: Math.random()*Math.PI*2,
        speed: 0.4 + Math.random()*0.6,
        sparkle:true
      });
    }
  })();

  /* warp starfield with parallax depth (closer stars = faster + bigger => 3D travel feel) */
  const warpStars = [];
  (function buildWarp(){
    for(let i=0;i<220;i++){
      const depth = Math.random(); // 0 = far, 1 = close
      warpStars.push({
        angle: Math.random()*Math.PI*2, dist: Math.random()*50,
        depth,
        speed: 140 + depth*620,
        len: (14 + depth*60)
      });
    }
  })();

  /* shooting stars: diagonal comets with tapered glowing trails, staggered during the journey */
  const shootingStars = [];
  (function buildShootingStars(){
    const defs = [
      { delay: 180,  dur: 620, y0: 0.10, y1: 0.42, dir: 1 },
      { delay: 560,  dur: 560, y0: 0.68, y1: 0.30, dir: -1 },
      { delay: 980,  dur: 640, y0: 0.18, y1: 0.55, dir: 1 },
      { delay: 1380, dur: 520, y0: 0.55, y1: 0.15, dir: -1 }
    ];
    defs.forEach(d=>{
      shootingStars.push({
        delay: d.delay, dur: d.dur,
        y0: d.y0, y1: d.y1, dir: d.dir,
        color: Math.random()<0.5 ? '#fff9e8' : '#ffe8b8'
      });
    });
  })();

  /* colorful burst particles for a brighter, more festive ignition */
  const BURST_COLORS = ['#fff6d8','#ffd84d','#ffb347','#ff9ecb','#ffe08a','#fff0c2','#c9a7ff','#9ecbff'];
  const burstParticles = [];
  (function buildBurst(){
    for(let i=0;i<170;i++){
      const angle = Math.random()*Math.PI*2;
      burstParticles.push({
        angle, speed: 55 + Math.random()*185,
        size: Math.random()*3.4 + 1.6,
        color: BURST_COLORS[Math.floor(Math.random()*BURST_COLORS.length)],
        flat: 0.45 + Math.random()*0.3
      });
    }
  })();

  /* expanding shockwave rings at ignition */
  const SHOCK_RINGS = [
    { startOffset: 0,   color: '#fffdf3' },
    { startOffset: 110, color: '#ffd989' },
    { startOffset: 230, color: '#ff9ecb' }
  ];

  /* ============ SPIRAL GALAXY (center swirl, like the reference video) ============ */
  const spiralParticles = [];
  (function buildSpiral(){
    const arms = 2, perArm = 340;
    for(let a=0; a<arms; a++){
      for(let i=0; i<perArm; i++){
        const t = i/perArm;
        const angle = t * Math.PI * 3.2 + a * Math.PI;
        const radius = t; // normalized 0..1, scaled at draw time
        const jitter = (Math.random()-0.5) * (0.07 + t*0.16);
        const jAngle = angle + (Math.random()-0.5)*0.5;
        spiralParticles.push({
          baseAngle: jAngle, radius: radius + jitter,
          size: Math.random()*1.5 + (t<0.15 ? 1.6 : 0.5),
          tw: Math.random()*Math.PI*2, twSpeed: 0.5 + Math.random()*1.2,
          bright: 1 - t*0.6
        });
      }
    }
    for(let i=0;i<150;i++){
      const angle = Math.random()*Math.PI*2;
      const radius = Math.sqrt(Math.random())*0.12;
      spiralParticles.push({
        baseAngle:angle, radius:radius,
        size: Math.random()*1.7+0.8, tw: Math.random()*Math.PI*2, twSpeed: 0.8+Math.random(),
        bright: 1
      });
    }
  })();

  /* ============ BIG PARTICLE FLOWER ============ */
  const flowerParticles = [];
  (function buildFlower(){
    const petals = 6;
    const perPetal = 300;
    for(let k=0;k<petals;k++){
      const petalAngle = (k / petals) * Math.PI*2 - Math.PI/2;
      for(let i=0;i<perPetal;i++){
        const t = Math.random();
        const widthAtT = Math.pow(Math.sin(t*Math.PI), 0.55);
        const dist = t;
        const perp = (Math.random()-0.5) * 2 * widthAtT * 0.38;
        // local coords: x along petal axis (0..1), y perpendicular
        const lx = dist;
        const ly = perp;
        // rotate into place
        const cosA = Math.cos(petalAngle), sinA = Math.sin(petalAngle);
        const ox = lx*cosA - ly*sinA;
        const oy = lx*sinA + ly*cosA;
        flowerParticles.push({
          ox: ox * flowerLenRef(), oy: oy * flowerLenRef(),
          oxN: ox, oyN: oy,
          size: Math.random()*1.5 + 0.5,
          tw: Math.random()*Math.PI*2, twSpeed: 0.5+Math.random(),
          core: false
        });
      }
    }
    for(let i=0;i<260;i++){
      const ang = Math.random()*Math.PI*2;
      const rad = Math.sqrt(Math.random())*0.11;
      flowerParticles.push({
        oxN: Math.cos(ang)*rad, oyN: Math.sin(ang)*rad,
        size: Math.random()*1.8+0.8, tw: Math.random()*Math.PI*2, twSpeed:0.7+Math.random(),
        core:true
      });
    }
  })();
  function flowerLenRef(){ return 1; } // placeholder, real scale applied at draw time using normalized coords

  /* ============ TIMELINE ============ */
  let startTime = null, lastFrame = null;
  const warpDuration = 1850;
  const introDuration = 2200;
  let rotationDrift = 0;
  let flashed = false;
  let burstStart = null;
  let carouselAngle = 0;
  let nextAmbientSpawn = 5000;

  function easeOutCubic(x){ return 1 - Math.pow(1-x,3); }

  function draw(now){
    if(startTime === null){ startTime = now; lastFrame = now; }
    const elapsed = now - startTime;
    const dt = Math.min((now - lastFrame)/1000, 0.05);
    lastFrame = now;

    ctx.clearRect(0,0,W,H);

    const breathe = Math.sin(now*0.00032) * 5;
    const breatheY = Math.cos(now*0.00026) * 4;

    // fuller warm background wash (reduces "too much black")
    const bgGrad = ctx.createRadialGradient(orbitCX, orbitCY, 10, orbitCX, orbitCY, Math.max(W,H)*0.95);
    bgGrad.addColorStop(0, 'rgba(75,64,10,0.5)');
    bgGrad.addColorStop(0.4, 'rgba(38,32,8,0.55)');
    bgGrad.addColorStop(1, 'rgba(4,3,7,1)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,W,H);
    const topGrad = ctx.createRadialGradient(flowerCX, flowerCY, 10, flowerCX, flowerCY, minDim*0.7);
    topGrad.addColorStop(0, 'rgba(90,78,14,0.35)');
    topGrad.addColorStop(1, 'rgba(4,3,7,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0,0,W,H);

    // ambient background sunflowers: slowly spinning AND gently floating/pulsing
    if(bgFlowerImg.complete && bgFlowerImg.naturalWidth > 0){
      const sceneFade = Math.min(Math.max(elapsed - warpDuration*0.5,0) / introDuration, 1);
      for(const bf of BG_FLOWERS){
        const floatX = Math.sin(now*0.0004*bf.speed*4 + bf.xPct*8) * minDim*0.025;
        const floatY = Math.cos(now*0.00035*bf.speed*4 + bf.yPct*8) * minDim*0.022;
        const bx = W*bf.xPct + floatX, by = H*bf.yPct + floatY;
        const pulse = 1 + Math.sin(now*0.0006 + bf.xPct*6)*0.08;
        const bsize = minDim*bf.size*pulse;
        const angle = now*0.00035*bf.speed*bf.dir + bf.xPct*10;
        ctx.save();
        ctx.translate(bx,by);
        ctx.rotate(angle);
        ctx.globalAlpha = bf.opacity * sceneFade;
        ctx.drawImage(bgFlowerImg, -bsize/2, -bsize/2, bsize, bsize);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // gentle butterflies drifting across the background
    {
      const sceneFade = Math.min(Math.max(elapsed - warpDuration*0.5,0) / introDuration, 1);
      for(const bfl of BUTTERFLIES){
        const t = now*0.001;
        const bx = W*(bfl.baseX + Math.sin(t*bfl.freqX + bfl.phase)*bfl.ampX);
        const by = H*(bfl.baseY + Math.cos(t*bfl.freqY + bfl.phase)*bfl.ampY);
        const heading = Math.atan2(
          Math.cos(t*bfl.freqY + bfl.phase)*bfl.ampY*-1,
          Math.cos(t*bfl.freqX + bfl.phase)*bfl.ampX
        );
        const flap = Math.sin(now*0.001*bfl.flapSpeed);
        const wingAngle = 0.3 + Math.abs(flap)*0.9;
        ctx.save();
        ctx.translate(bx,by);
        ctx.rotate(heading);
        ctx.globalAlpha = bfl.opacity * sceneFade;
        ctx.fillStyle = bfl.color;
        ctx.shadowColor = bfl.color; ctx.shadowBlur = 6;
        // left wing
        ctx.save(); ctx.rotate(-wingAngle);
        ctx.beginPath(); ctx.ellipse(-bfl.size*0.55,0, bfl.size*0.62, bfl.size*0.42, 0,0,Math.PI*2); ctx.fill();
        ctx.restore();
        // right wing
        ctx.save(); ctx.rotate(wingAngle);
        ctx.beginPath(); ctx.ellipse(bfl.size*0.55,0, bfl.size*0.62, bfl.size*0.42, 0,0,Math.PI*2); ctx.fill();
        ctx.restore();
        // body
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,250,235,0.9)';
        ctx.beginPath(); ctx.ellipse(0,0, bfl.size*0.09, bfl.size*0.4, 0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // warp intro streaks (parallax depth: closer stars fly faster & bigger = real 3D travel feel)
    const warpP = Math.min(elapsed / warpDuration, 1);
    if(warpP < 1){
      ctx.save();
      ctx.translate(orbitCX, orbitCY);
      ctx.globalCompositeOperation = 'lighter';
      const fadeOut = warpP > 0.82 ? 1 - (warpP-0.82)/0.18 : 1;
      for(const ws of warpStars){
        const dist = ws.dist + ws.speed * (elapsed/1000);
        const x = Math.cos(ws.angle)*dist, y = Math.sin(ws.angle)*dist*0.6;
        const x2 = Math.cos(ws.angle)*(dist-ws.len), y2 = Math.sin(ws.angle)*(dist-ws.len)*0.6;
        const a = (0.35 + ws.depth*0.55) * fadeOut;
        ctx.strokeStyle = `rgba(255,242,205,${a})`;
        ctx.lineWidth = 0.8 + ws.depth*1.8;
        ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x,y); ctx.stroke();
        if(ws.depth > 0.72){
          ctx.globalAlpha = a;
          ctx.fillStyle = '#fffdf5';
          ctx.beginPath(); ctx.arc(x,y, 1.1+ws.depth*1.1, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    // ambient shooting stars: keep appearing occasionally throughout the whole scene
    if(elapsed > nextAmbientSpawn){
      shootingStars.push({
        delay: elapsed, dur: 550 + Math.random()*250,
        y0: 0.08 + Math.random()*0.30,
        y1: 0.30 + Math.random()*0.45,
        dir: Math.random()<0.5 ? 1 : -1,
        color: Math.random()<0.5 ? '#fff9e8' : '#ffe8b8'
      });
      nextAmbientSpawn = elapsed + 2600 + Math.random()*3200;
      if(shootingStars.length > 20) shootingStars.splice(0, shootingStars.length-20);
    }

    // shooting stars: diagonal comets with tapered glowing trail
    {
      for(const sh of shootingStars){
        const sElapsed = elapsed - sh.delay;
        if(sElapsed < 0 || sElapsed > sh.dur) continue;
        const p = sElapsed / sh.dur;
        const easeP = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
        const x0 = sh.dir > 0 ? -40 : W+40;
        const x1v = sh.dir > 0 ? W+40 : -40;
        const y0px = H*sh.y0, y1px = H*sh.y1;
        const hx = x0 + (x1v-x0)*easeP;
        const hy = y0px + (y1px-y0px)*easeP;
        const dx = x1v-x0, dy = y1px-y0px;
        const dlen = Math.hypot(dx,dy) || 1;
        const tailLen = 95;
        const tx = hx - (dx/dlen)*tailLen;
        const ty = hy - (dy/dlen)*tailLen;
        const fadeEdge = Math.sin(Math.min(p,1)*Math.PI);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const grad = ctx.createLinearGradient(tx,ty,hx,hy);
        grad.addColorStop(0, 'rgba(255,240,200,0)');
        grad.addColorStop(1, sh.color);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.2;
        ctx.globalAlpha = fadeEdge;
        ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(hx,hy); ctx.stroke();
        ctx.fillStyle = '#fffdf6';
        ctx.shadowColor = sh.color; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(hx,hy,2.6,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }

    if(!flashed && elapsed > warpDuration*0.55){
      flashed = true;
      burstStart = elapsed;
      const flashEl = document.getElementById('flash');
      flashEl.style.transition = 'none';
      flashEl.style.background = 'radial-gradient(circle, #fffef4 0%, #ffe6a3 35%, #ffb3d1 65%, rgba(255,179,209,0) 100%)';
      flashEl.style.opacity = '0.7';
      requestAnimationFrame(()=>{
        flashEl.style.transition = 'opacity 0.6s ease';
        flashEl.style.opacity = '0';
      });
    }

    // expanding shockwave rings (layered light pulse at ignition)
    if(burstStart !== null){
      ctx.save();
      ctx.translate(orbitCX, orbitCY);
      ctx.globalCompositeOperation = 'lighter';
      const maxR = minDim*0.62;
      SHOCK_RINGS.forEach(sr=>{
        const rElapsed = elapsed - burstStart - sr.startOffset;
        if(rElapsed < 0) return;
        const rDur = 900;
        const rp = Math.min(rElapsed/rDur, 1);
        if(rp >= 1) return;
        const r = easeOutCubic(rp) * maxR;
        const alpha = (1-rp) * 0.55;
        ctx.strokeStyle = sr.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.ellipse(0,0, r, r*0.62, 0, 0, Math.PI*2); ctx.stroke();
      });
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }

    // colorful burst (brighter, festive ignition)
    if(burstStart !== null){
      const bElapsed = elapsed - burstStart;
      const bDur = 1400;
      const bP = Math.min(bElapsed / bDur, 1);
      if(bP < 1){
        ctx.save();
        ctx.translate(orbitCX, orbitCY);
        ctx.globalCompositeOperation = 'lighter';
        const fade = 1 - bP;
        for(const bp of burstParticles){
          const dist = bp.speed * (bElapsed/1000);
          const x = Math.cos(bp.angle) * dist;
          const y = Math.sin(bp.angle) * dist * bp.flat;
          ctx.globalAlpha = fade * 0.9;
          ctx.fillStyle = bp.color;
          ctx.shadowColor = bp.color;
          ctx.shadowBlur = 12;
          ctx.beginPath(); ctx.arc(x,y,bp.size,0,Math.PI*2); ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.restore();
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // dramatic scale pulse right when the scene ignites
    let pulseScale = 1;
    if(burstStart !== null){
      const pElapsed = elapsed - burstStart;
      if(pElapsed >= 0 && pElapsed < 600){
        const pp = pElapsed/600;
        pulseScale = 1 + Math.sin(pp*Math.PI) * 0.10;
      }
    }

    // starfield
    for(const s of stars){
      const sx = (s.rx*W) + Math.sin(now*0.00005+s.phase)*6;
      const sy = (s.ry*H) + Math.cos(now*0.00004+s.phase)*6;
      const alpha = 0.35 + 0.65*Math.abs(Math.sin(now*0.001*s.speed+s.phase));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fff6d8';
      ctx.beginPath(); ctx.arc(sx,sy,s.r,0,Math.PI*2); ctx.fill();
      if(s.sparkle){
        ctx.globalAlpha = alpha*0.55;
        ctx.strokeStyle = '#fff6d8';
        ctx.lineWidth = 0.6;
        const sl = s.r*3.2;
        ctx.beginPath(); ctx.moveTo(sx-sl,sy); ctx.lineTo(sx+sl,sy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx,sy-sl); ctx.lineTo(sx,sy+sl); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // ---- big particle flower (with 3D-like carousel spin via horizontal squash) ----
    const flowerP = Math.min(Math.max(elapsed - warpDuration*0.4,0) / introDuration, 1);
    const flowerScale = easeOutCubic(flowerP);
    rotationDrift += 0.0015 * dt * 60;
    carouselAngle += 0.34 * dt;
    const flowerSquash = 0.38 + 0.62*Math.abs(Math.cos(carouselAngle*0.8));
    ctx.save();
    ctx.translate(flowerCX + breathe*0.4, flowerCY + breatheY*0.4);
    ctx.rotate(Math.sin(now*0.00018)*0.03);
    ctx.scale(flowerScale*pulseScale*flowerSquash, flowerScale*pulseScale);
    for(const p of flowerParticles){
      const tw = 0.55 + 0.45*Math.sin(now*0.001*p.twSpeed + p.tw);
      const x = p.oxN * flowerLen;
      const y = p.oyN * flowerLen;
      ctx.globalAlpha = tw * flowerScale;
      ctx.fillStyle = p.core ? '#fffaf0' : (Math.random()<0.5 ? '#ffe066' : '#ffd23f');
      ctx.beginPath(); ctx.arc(x,y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // stem glow connecting flower to orbit center
    ctx.save();
    ctx.globalAlpha = 0.5 * flowerScale;
    const stemGrad = ctx.createLinearGradient(flowerCX, flowerCY, orbitCX, orbitCY);
    stemGrad.addColorStop(0, 'rgba(255,224,120,0.5)');
    stemGrad.addColorStop(1, 'rgba(255,224,120,0)');
    ctx.strokeStyle = stemGrad;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(flowerCX, flowerCY + flowerLen*0.3); ctx.lineTo(orbitCX, orbitCY); ctx.stroke();
    ctx.restore();

    // ---- orbit rings (dotted ellipses, with 3D carousel tilt) ----
    const ringP = Math.min(Math.max(elapsed - warpDuration*0.6,0) / (introDuration*1.1), 1);
    const ringScale = easeOutCubic(ringP) * pulseScale;
    const tiltWobble = (0.56 + 0.44*Math.cos(carouselAngle*0.8)) * (0.94 + 0.06*Math.cos(carouselAngle*1.7));
    ctx.save();
    ctx.translate(orbitCX + breathe, orbitCY + breatheY);
    ctx.scale(ringScale, ringScale);
    RINGS.forEach((ring, ri)=>{
      const dots = 90;
      const ringB = ring.b * tiltWobble;
      for(let j=0;j<dots;j++){
        const ang = (j/dots)*Math.PI*2 + carouselAngle + rotationDrift*(ri%2===0?1:-1)*0.1;
        const x = Math.cos(ang)*ring.a;
        const y = Math.sin(ang)*ringB;
        const tw = 0.3 + 0.5*Math.abs(Math.sin(now*0.0012 + j*0.3 + ri));
        ctx.globalAlpha = tw * 0.85;
        ctx.fillStyle = '#fff3d6';
        ctx.beginPath(); ctx.arc(x,y, j%9===0?1.6:0.9, 0, Math.PI*2); ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    // ---- spiral galaxy core (rotating, like the reference video) + bright glow ----
    const coreScale = (1 + Math.sin(now*0.0016)*0.05) * pulseScale;
    const spiralRadius = RINGS[0].a * 0.92;
    const spiralFlatten = 0.34 * tiltWobble;
    ctx.save();
    ctx.translate(orbitCX+breathe, orbitCY+breatheY);

    // soft ambient halo behind the spiral
    const glowR = minDim*0.20*coreScale;
    const coreGrad = ctx.createRadialGradient(0,0,0,0,0,glowR);
    coreGrad.addColorStop(0, 'rgba(255,250,225,0.9)');
    coreGrad.addColorStop(0.45, 'rgba(255,220,120,0.32)');
    coreGrad.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath(); ctx.arc(0,0,glowR,0,Math.PI*2); ctx.fill();

    // rotating spiral arms (3D: squashed by the same tilt as the rings)
    ctx.rotate(carouselAngle*1.3 + rotationDrift);
    ctx.scale(coreScale, coreScale);
    for(const p of spiralParticles){
      const tw = 0.55 + 0.45*Math.sin(now*0.0011*p.twSpeed + p.tw);
      const x = Math.cos(p.baseAngle) * p.radius * spiralRadius;
      const y = Math.sin(p.baseAngle) * p.radius * spiralRadius * spiralFlatten;
      ctx.globalAlpha = p.bright * tw;
      ctx.fillStyle = p.bright > 0.85 ? '#fffaf0' : '#ffd35c';
      ctx.beginPath(); ctx.arc(x,y,p.size,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // bright white-gold core (no dark hole, matches the reference video)
    const coreR = minDim*0.028*coreScale;
    const innerGrad = ctx.createRadialGradient(0,0,0,0,0,coreR*2.6);
    innerGrad.addColorStop(0, 'rgba(255,255,250,1)');
    innerGrad.addColorStop(0.5, 'rgba(255,238,180,0.75)');
    innerGrad.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.fillStyle = innerGrad;
    ctx.beginPath(); ctx.arc(0,0,coreR*2.6,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // ---- update orbiting icons + phrases (with pseudo-3D depth) ----
    for(const it of orbitRuntime){
      it.angle += it.speed * dt;
      const ring = RINGS[it.ring];
      const effAngle = it.angle + carouselAngle;
      const ringB = ring.b * tiltWobble;
      let x = orbitCX + breathe + Math.cos(effAngle) * ring.a;
      let y = orbitCY + breatheY + Math.sin(effAngle) * ringB;
      x = Math.min(Math.max(x, 30), W-30);
      y = Math.min(Math.max(y, H*0.30), H-24);
      const tilt = ((x - orbitCX) / (W/2)) * 14;

      // depth: 0 = far side of the ring (back), 1 = near side (front)
      const depthT = (Math.sin(effAngle) + 1) / 2;
      const depthScale = it.isIcon ? (0.62 + depthT*0.66) : (0.85 + depthT*0.3);
      const depthOpacity = 0.5 + depthT*0.5;

      it.el.style.transform = `translate(${x}px, ${y}px) rotate(${tilt}deg) scale(${depthScale})`;
      it.el.style.opacity = depthOpacity;
      it.el.style.zIndex = 10 + Math.round(depthT*40);
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();

  /* ============ DOM: build orbit items ============ */
  const orbitContainer = document.getElementById('orbit-container');
  const orbitRuntime = [];

  ICON_ITEMS.forEach((f)=>{
    const outer = document.createElement('div');
    outer.className = 'orbit-item';
    const inner = document.createElement('div');
    inner.className = 'orbit-inner icon';
    const img = document.createElement('img');
    img.className = 'flower-img';
    img.src = FLOWER_IMAGES[f.type];
    img.alt = '';
    img.onerror = function(){ this.onerror=null; this.src = FALLBACK_IMG; };
    inner.appendChild(img);
    outer.appendChild(inner);
    orbitContainer.appendChild(outer);
    orbitRuntime.push({ el:outer, inner:inner, angle:f.angleDeg*Math.PI/180, speed:(0.04+Math.random()*0.03)*(Math.random()<0.5?1:-1), ring:f.ring, isIcon:true });
  });

  PHRASES.forEach((text,i)=>{
    const ring = i % 3;
    const sizeCls = ring===0 ? 'big' : (ring===1 ? 'mid' : 'small');
    const outer = document.createElement('div');
    outer.className = 'orbit-item';
    const inner = document.createElement('div');
    inner.className = 'orbit-inner phrase ' + sizeCls;
    inner.textContent = text;
    outer.appendChild(inner);
    orbitContainer.appendChild(outer);
    const angleDeg = (i / PHRASES.length) * 360;
    orbitRuntime.push({ el:outer, inner:inner, angle:angleDeg*Math.PI/180, speed:(0.012+Math.random()*0.015)*(i%2===0?1:-1), ring:ring, isIcon:false });
  });

  function runSequence(){
    requestAnimationFrame(draw);
    setTimeout(()=> document.getElementById('title').classList.add('show'), 700);
    setTimeout(()=> document.getElementById('subtitle').classList.add('show'), 2600);

    orbitRuntime.forEach((it,i)=>{
      setTimeout(()=> it.inner.classList.add('show'), 2600 + i*110);
    });

    setTimeout(()=>{
      document.getElementById('open-letter-btn').classList.add('show');
    }, 2600 + orbitRuntime.length*110 + 500);

    document.getElementById('sound-toggle').classList.add('show');
  }

  /* ============ AUDIO — upbeat, joyful music-box tune ============ */
  let audioCtx = null, masterGain = null, musicOn = true, reverbSend = null, noiseBuffer = null;

  function buildReverbBus(ctx, destination){
    const bus = ctx.createGain(); bus.gain.value = 0.34;
    [0.20,0.30,0.42].forEach((t)=>{
      const d = ctx.createDelay(1.5); d.delayTime.value = t;
      const fb = ctx.createGain(); fb.gain.value = 0.26;
      const damp = ctx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2800;
      bus.connect(d); d.connect(damp); damp.connect(fb); fb.connect(d);
      damp.connect(destination);
    });
    return bus;
  }

  function buildNoiseBuffer(ctx){
    const buf = ctx.createBuffer(1, ctx.sampleRate*0.2, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
    return buf;
  }

  function initAudio(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 0.0;
    masterGain.connect(audioCtx.destination);
    masterGain.gain.linearRampToValueAtTime(0.26, audioCtx.currentTime + 1.4);
    reverbSend = buildReverbBus(audioCtx, masterGain);
    noiseBuffer = buildNoiseBuffer(audioCtx);

    const padFilter = audioCtx.createBiquadFilter();
    padFilter.type='lowpass'; padFilter.frequency.value=1900;
    padFilter.connect(masterGain); padFilter.connect(reverbSend);
    const lfo = audioCtx.createOscillator(); lfo.frequency.value=0.14;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value=150;
    lfo.connect(lfoGain); lfoGain.connect(padFilter.frequency); lfo.start();

    // happy major-key chords (C - G - Am - F), shorter & punchier for a livelier feel
    const chords = [
      [261.63, 329.63, 392.00], // C
      [196.00, 246.94, 392.00], // G
      [220.00, 261.63, 329.63], // Am
      [174.61, 220.00, 261.63]  // F
    ];
    const bassNotes = [130.81, 98.00, 110.00, 87.31]; // roots, played as a bouncy pulse
    let chordIndex = 0;
    const chordDur = 2200;

    function playChord(freqs){
      const now = audioCtx.currentTime;
      freqs.forEach((f,idx)=>{
        const osc = audioCtx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = f;
        const g = audioCtx.createGain(); g.gain.value=0;
        const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        if(pan) pan.pan.value=(idx-1)*0.22;
        osc.connect(g);
        if(pan){ g.connect(pan); pan.connect(padFilter); } else { g.connect(padFilter); }
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.05, now+0.15);
        g.gain.linearRampToValueAtTime(0.0, now+2.0);
        osc.start(now); osc.stop(now+2.1);
      });
    }

    // bouncy bass pluck — two per chord, like a light "boom-boom" pulse
    function playBassPluck(freq, t){
      const g = audioCtx.createGain(); g.gain.value=0;
      const osc = audioCtx.createOscillator(); osc.type='triangle'; osc.frequency.value=freq;
      osc.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.11, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.38);
      osc.start(t); osc.stop(t+0.4);
    }

    // soft shaker tick — subtle rhythmic texture, very quiet
    function playShaker(t){
      const src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
      const hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5500;
      const g = audioCtx.createGain(); g.gain.value=0;
      src.connect(hp); hp.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.018, t+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.09);
      src.start(t); src.stop(t+0.1);
    }

    function loopChords(){
      const now = audioCtx.currentTime;
      playChord(chords[chordIndex%chords.length]);
      const bass = bassNotes[chordIndex%bassNotes.length];
      playBassPluck(bass, now);
      playBassPluck(bass*2, now + chordDur/2000);
      for(let s=0; s<4; s++) playShaker(now + s*chordDur/4000 + 0.05);
      chordIndex++;
      setTimeout(loopChords, chordDur);
    }
    loopChords();

    // playful, bouncier music-box melody (C major pentatonic, faster tempo)
    const MELODY = [783.99,659.25,880.00,659.25, 523.25,659.25,783.99,987.77,
                     880.00,783.99,659.25,783.99, 587.33,698.46,880.00,783.99,
                     659.25,523.25,659.25,783.99];
    let melodyIndex = 0;
    function playMelody(){
      if(musicOn){
        const now = audioCtx.currentTime;
        const f = MELODY[melodyIndex % MELODY.length];
        const accent = melodyIndex % 4 === 0;
        const osc = audioCtx.createOscillator(); osc.type='triangle'; osc.frequency.value=f;
        const g = audioCtx.createGain(); g.gain.value=0;
        const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        if(pan) pan.pan.value = (melodyIndex%2===0 ? -1 : 1) * 0.32;
        osc.connect(g);
        if(pan){ g.connect(pan); pan.connect(masterGain); pan.connect(reverbSend); }
        else { g.connect(masterGain); g.connect(reverbSend); }
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(accent ? 0.07 : 0.05, now+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now+0.32);
        osc.start(now); osc.stop(now+0.35);
      }
      melodyIndex++;
      setTimeout(playMelody, 225);
    }
    setTimeout(playMelody, 700);
  }

  let usingCustomSong = false;
  function toggleSound(){
    musicOn = !musicOn;
    const btn = document.getElementById('sound-toggle');
    if(usingCustomSong){
      const bgMusic = document.getElementById('bg-music');
      if(musicOn){ bgMusic.play().catch(()=>{}); btn.textContent='🔊'; }
      else{ bgMusic.pause(); btn.textContent='🔇'; }
      return;
    }
    if(!audioCtx) return;
    if(musicOn){ masterGain.gain.linearRampToValueAtTime(0.26, audioCtx.currentTime+0.8); btn.textContent='🔊'; }
    else{ masterGain.gain.linearRampToValueAtTime(0.0, audioCtx.currentTime+0.5); btn.textContent='🔇'; }
  }
  document.getElementById('sound-toggle').addEventListener('click', toggleSound);

  /* ---- try the user's own song first; fall back to the generated music ---- */
  function startMusic(){
    const bgMusic = document.getElementById('bg-music');
    let fellBack = false;
    function fallbackToGenerated(){
      if(fellBack) return;
      fellBack = true;
      usingCustomSong = false;
      initAudio();
    }
    bgMusic.addEventListener('error', fallbackToGenerated);
    bgMusic.src = MUSIC_FILE;
    bgMusic.volume = 0.55;
    bgMusic.play().then(()=>{
      if(!fellBack){ usingCustomSong = true; }
    }).catch(fallbackToGenerated);
  }

  /* ============ TAP TO START ============ */
  const tapOverlay = document.getElementById('tap-overlay');
  tapOverlay.addEventListener('click', function once(){
    tapOverlay.removeEventListener('click', once);
    tapOverlay.classList.add('hidden');
    startMusic();
    runSequence();
  }, { once:true });

  /* ============ LETTER ============ */
  const modal = document.getElementById('letter-modal');
  const envelopeWrap = document.getElementById('envelope-wrap');
  const letterCard = document.getElementById('letter-card');

  document.getElementById('open-letter-btn').addEventListener('click', ()=>{
    modal.classList.add('show');
    envelopeWrap.classList.remove('opening','opened');
    letterCard.classList.remove('show');
  });
  envelopeWrap.addEventListener('click', ()=>{
    envelopeWrap.classList.add('opening');
    setTimeout(()=>{ envelopeWrap.classList.add('opened'); letterCard.classList.add('show'); }, 750);
  });
  function closeLetter(){ modal.classList.remove('show'); }
  document.getElementById('close-letter').addEventListener('click', closeLetter);
  modal.addEventListener('click', (e)=>{ if(e.target===modal) closeLetter(); });

})();
</script>
